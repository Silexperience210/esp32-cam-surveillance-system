<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>📸 Galerie détections</title>
<style>
:root{--bg:#080808;--card:#111;--border:#1a1a1a;--accent:#F7931A;--text:#ccc;--dim:#666}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:monospace;background:var(--bg);color:var(--text);padding:12px}
h1{color:var(--accent);font-size:1.1rem;margin-bottom:12px}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.card{background:var(--card);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.card img{width:100%;height:180px;object-fit:cover;display:block}
.card .info{padding:8px 10px;font-size:0.75rem}
.card .time{color:var(--dim)}
.card .desc{color:var(--text);margin-top:3px;line-height:1.3}
.card.alert{border-left:3px solid #e74c3c}
.badge{font-size:0.6rem;padding:2px 5px;border-radius:3px;font-weight:bold;margin-left:4px}
.badge.alert{background:#e74c3c22;color:#e74c3c}
.badge.ok{background:#2ecc7122;color:#2ecc71}
</style>
</head>
<body>
<h1>📸 Dernières détections</h1>
<div class="gallery" id="gallery">Chargement...</div>
<script>
async function load(){
  try {
    const r = await fetch('/api/ai/gallery?limit=50');
    const items = await r.json();
    document.getElementById('gallery').innerHTML = items.map(i => {
      const time = (i.time||'').substring(11,19);
      const cls = i.alert ? 'alert' : '';
      return `<div class="card ${cls}">
        <img src="${i.image}" loading="lazy" onerror="this.style.display='none'">
        <div class="info">
          <span class="time">🕐 ${time}</span>
          ${i.alert ? '<span class="badge alert">🚨ALERTE</span>' : ''}
          <div class="desc">${i.desc||'?'}</div>
        </div>
      </div>`;
    }).join('') || '<p style="color:var(--dim)">Aucune détection avec personne.</p>';
  } catch(e) {
    document.getElementById('gallery').innerHTML = 'Erreur chargement';
  }
}
load();
</script>
</body>
</html>
