<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>🧠 Hermes AI Eye — Dashboard</title>
<style>
:root{--bg:#080808;--card:#111;--border:#1a1a1a;--accent:#F7931A;--text:#ccc;--dim:#666;--green:#2ecc71;--red:#e74c3c;--blue:#3498db}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:monospace;background:var(--bg);color:var(--text);min-height:100vh}
.container{max-width:1400px;margin:0 auto;padding:16px}
h1{color:var(--accent);font-size:1.2rem;margin-bottom:16px}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px}
.card h2{font-size:0.85rem;color:var(--dim);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px}
.stat-row{display:flex;justify-content:space-between;padding:3px 0;font-size:0.8rem;border-bottom:1px solid rgba(255,255,255,0.03)}
.stat-row .val{color:var(--accent);font-weight:bold}
.pulse{animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.event{font-size:0.75rem;padding:4px 0;border-bottom:1px solid rgba(255,255,255,0.02);display:flex;gap:6px}
.event .time{color:var(--dim);min-width:50px}
.event .icon{min-width:20px}
.event .desc{flex:1}
.event.person{border-left:3px solid var(--red)}
.event.vehicle{border-left:3px solid var(--blue)}
.event.animal{border-left:3px solid var(--green)}
.event.none{border-left:3px solid var(--dim)}
.heatmap{width:100%;aspect-ratio:4/3;background:#000;border-radius:8px;position:relative;overflow:hidden}
.heatmap canvas{width:100%;height:100%}
#events{max-height:300px;overflow-y:auto}
.badge{font-size:0.65rem;padding:2px 6px;border-radius:4px;font-weight:bold}
.badge.on{background:#2ecc7122;color:var(--green)}
.badge.off{background:#e74c3c22;color:var(--red)}
.btn-row{display:flex;gap:6px;margin-top:8px}
.btn{flex:1;padding:8px;border:1px solid var(--border);border-radius:6px;background:var(--card);color:var(--text);cursor:pointer;font-size:0.75rem;font-family:monospace}
.btn:hover{border-color:var(--accent)}
.btn.active{background:var(--accent);color:#000;border-color:var(--accent)}
</style>
</head>
<body>
<div class="container">
<h1>🧠 Hermes AI Eye</h1>
<div class="grid">
  <div class="card">
    <h2>📊 Stats</h2>
    <div class="stat-row"><span>IA</span><span id="ai-status"><span class="badge on">ON</span></span></div>
    <div class="stat-row"><span>Analyses</span><span class="val" id="total-events">0</span></div>
    <div class="stat-row"><span>Personnes</span><span class="val" id="person-count">0</span></div>
    <div class="stat-row"><span>Véhicules</span><span class="val" id="vehicle-count">0</span></div>
    <div class="stat-row"><span>GPU</span><span class="val" id="gpu-info">—</span></div>
    <div class="stat-row"><span>Snapshots</span><span class="val" id="snap-count">0</span></div>
    <div class="btn-row">
      <button class="btn active" onclick="toggleAI()" id="btn-ai">⏯️ AI</button>
      <button class="btn" onclick="forceAnalyze()">🔍 Analyser</button>
      <button class="btn" onclick="liveView('Atelier')" id="btn-live">🔴 Live</button>
    </div>
  </div>
  <div class="card">
    <h2>🔥 Heatmap mouvement</h2>
    <div class="heatmap"><canvas id="heatmap-canvas"></canvas></div>
  </div>
  <div class="card">
    <h2>📋 Derniers événements</h2>
    <div id="events">Chargement...</div>
  </div>
  <div class="card" id="anomaly-card" style="display:none">
    <h2>🔮 Anomalies</h2>
    <div id="anomalies"></div>
  </div>
</div>
<div class="grid" style="margin-top:12px">
  <div class="card">
    <h2>🔄 Multi-caméras tracking</h2>
    <div id="tracking-view">Chargement...</div>
  </div>
</div>
<div class="grid" style="margin-top:12px" id="mosaic">
  <div class="card" style="grid-column:1/-1">
    <h2>🖥️ Multi-caméras <a href="/gallery" style="color:var(--accent);font-size:0.7rem;float:right">📸 Galerie →</a></h2>
    <div id="cameras-view" style="display:flex;gap:10px;flex-wrap:wrap">Chargement...</div>
  </div>
</div>
</div>
<script>
const API = '/api/ai/';

async function load() {
  try {
    const r = await fetch(API + 'status');
    const d = await r.json();
    document.getElementById('total-events').textContent = d.total_events || 0;
    document.getElementById('person-count').textContent = d.persons || 0;
    document.getElementById('vehicle-count').textContent = d.vehicles || 0;
    document.getElementById('snap-count').textContent = d.snapshots || 0;
    document.getElementById('gpu-info').textContent = d.gpu || 'N/A';
    document.getElementById('ai-status').innerHTML = d.ai_enabled 
      ? '<span class="badge on">ON</span>' 
      : '<span class="badge off">OFF</span>';
  } catch(e) {}
  try {
    const r = await fetch(API + 'events?limit=20');
    const events = await r.json();
    const container = document.getElementById('events');
    container.innerHTML = events.map(e => {
      const hasPerson = e.desc.toLowerCase().includes('personne');
      const hasVehicle = e.desc.toLowerCase().includes('vehicule');
      const hasAnimal = e.desc.toLowerCase().includes('animal');
      const cls = hasPerson ? 'person' : (hasVehicle ? 'vehicle' : (hasAnimal ? 'animal' : 'none'));
      const icon = hasPerson ? '👤' : (hasVehicle ? '🚗' : (hasAnimal ? '🐾' : '👁️'));
      const time = e.time ? e.time.substring(11,19) : '--:--:--';
      return `<div class="event ${cls}"><span class="time">${time}</span><span class="icon">${icon}</span><span class="desc">${e.desc}</span></div>`;
    }).join('');
  } catch(e) { document.getElementById('events').innerHTML = 'Erreur chargement'; }
}

function toggleAI() {
  fetch(API + 'toggle').then(r => r.json()).then(d => {
    document.getElementById('ai-status').innerHTML = d.enabled 
      ? '<span class="badge on">ON</span>' 
      : '<span class="badge off">OFF</span>';
    document.getElementById('btn-ai').classList.toggle('active', d.enabled);
  });
}

function forceAnalyze() {
  fetch(API + 'analyze').then(() => setTimeout(load, 2000));
}

// Heatmap canvas — vraies données de détection
async function drawHeatmap() {
  const canvas = document.getElementById('heatmap-canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = canvas.offsetWidth;
  canvas.height = canvas.offsetHeight;
  ctx.fillStyle = '#080808';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  
  try {
    const r = await fetch(API + 'heatmap');
    const d = await r.json();
    const points = d.points || [];
    const [iw, ih] = d.image_size || [1600, 1200];
    
    // Grouper par proximité pour intensité
    const grid = {};
    for (const p of points) {
      const gx = Math.floor(p.x * 20);
      const gy = Math.floor(p.y * 20);
      const key = `${gx},${gy}`;
      grid[key] = (grid[key] || 0) + 1;
    }
    
    const maxCount = Math.max(1, ...Object.values(grid));
    for (const [key, count] of Object.entries(grid)) {
      const [gx, gy] = key.split(',').map(Number);
      const x = (gx / 20) * canvas.width;
      const y = (gy / 20) * canvas.height;
      const alpha = count / maxCount * 0.7;
      const r = 5 + (count / maxCount) * 40;
      
      const gradient = ctx.createRadialGradient(x, y, 0, x, y, r);
      gradient.addColorStop(0, `rgba(247,147,26,${alpha})`);
      gradient.addColorStop(0.5, `rgba(231,76,60,${alpha*0.4})`);
      gradient.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = gradient;
      ctx.fillRect(x-r, y-r, r*2, r*2);
    }
    
    // Label compteur
    ctx.fillStyle = '#666';
    ctx.font = '10px monospace';
    ctx.fillText(`${points.length} points / 24h`, 8, canvas.height-6);
  } catch(e) {
    ctx.fillStyle = '#444';
    ctx.font = '12px monospace';
    ctx.fillText('Données heatmap en attente...', 20, canvas.height/2);
  }
}

load();
drawHeatmap();
// SSE live updates — remplace le polling
const es = new EventSource('/api/ai/stream');
es.onmessage = function(e) {
  try {
    const d = JSON.parse(e.data);
    // Counter live
    if (d.counter) {
      document.getElementById('person-count').textContent = d.counter.persons || 0;
      document.getElementById('vehicle-count').textContent = d.vehicles || 0;
    }
    document.getElementById('snap-count').textContent = d.snapshots || 0;
    document.getElementById('ai-status').innerHTML = d.status
      ? '<span class="badge on">ON</span>'
      : '<span class="badge off">OFF</span>';
    // Events live (last 60s)
    if (d.events && d.events.length > 0) {
      const container = document.getElementById('events');
      container.innerHTML = d.events.slice(-15).reverse().map(e => {
        const hasPerson = e.desc.toLowerCase().includes('personne');
        const hasVehicle = e.desc.toLowerCase().includes('vehicule');
        const cls = hasPerson ? 'person' : (hasVehicle ? 'vehicle' : 'none');
        const icon = hasPerson ? '👤' : (hasVehicle ? '🚗' : '👁️');
        return `<div class="event ${cls}"><span class="time">${e.time}</span><span class="icon">${icon}</span><span class="desc">${e.desc}${e.alert ? ' 🚨' : ''}</span></div>`;
      }).join('');
    }
    // Anomalies
    if (d.anomalies && d.anomalies.length > 0) {
      document.getElementById('anomaly-card').style.display = '';
      document.getElementById('anomalies').innerHTML = d.anomalies.map(a =>
        `<div class="event none"><span class="icon">${a.severity||'⚠️'}</span><span class="desc">${a.message}</span></div>`
      ).join('');
    }
  } catch(ex) {}
};
es.onerror = () => { /* reconnect auto */ };
setInterval(drawHeatmap, 30000);

// Multi-cameras mosaic
async function loadCameras() {
  try {
    const r = await fetch('/api/cameras');
    const d = await r.json();
    const cams = d.cameras || [];
    const container = document.getElementById('cameras-view');
    container.innerHTML = cams.map(c => 
      `<div style="flex:1;min-width:300px;background:#000;border-radius:6px;overflow:hidden;border:1px solid var(--border)">
        <div style="padding:6px 10px;font-size:0.75rem;background:var(--card);display:flex;justify-content:space-between">
          <span>📷 ${c.name}</span>
          <span style="color:var(--dim)">${c.url}</span>
        </div>
        <img src="${c.url}:81/stream" style="width:100%;height:240px;object-fit:cover" 
             onerror="this.parentElement.innerHTML='<div style=height:240px;display:flex;align-items:center;justify-content:center;color:var(--red)>📡 Hors ligne</div>'">
      </div>`
    ).join('');
  } catch(e) {}
}
loadCameras();

// Multi-camera tracking
async function loadTracking() {
  try {
    const r = await fetch('/api/ai/tracking');
    const d = await r.json();
    const container = document.getElementById('tracking-view');
    if (!d.tracks || d.tracks.length === 0) {
      container.innerHTML = '<span style="color:var(--dim)">Aucune camera configuree</span>';
      return;
    }
    container.innerHTML = d.tracks.map(t => {
      const evts = t.events.slice(-5).reverse().map(e =>
        `<div class="event none"><span class="time">${e.time.substring(11,19)}</span><span class="icon">👤</span><span class="desc">${e.camera}: ${e.desc||'?'}</span></div>`
      ).join('');
      return `<div style="margin-bottom:8px"><strong>📷 ${t.camera}</strong> (${t.events.length} passages)</div>${evts}`;
    }).join('<hr style="border-color:var(--border);margin:6px 0">');
  } catch(e) {}
}
loadTracking();
setInterval(loadTracking, 15000);

// Live modal
function liveView(name) {
  let modal = document.getElementById('live-modal');
  if (!modal) {
    modal = document.createElement('div');
    modal.id = 'live-modal';
    modal.innerHTML = `
      <div style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center"
           onclick="this.parentElement.remove()">
        <img src="/api/stream" style="max-width:95vw;max-height:90vh;border-radius:8px" 
             onclick="event.stopPropagation()">
        <button onclick="event.stopPropagation();fetch('/api/led?state=toggle')" 
                style="position:absolute;top:16px;left:16px;background:#f39c12;color:#000;border:0;padding:8px 16px;border-radius:6px;font-size:1rem;cursor:pointer;font-weight:bold">💡 LED</button>
        <button onclick="this.parentElement.parentElement.remove()" 
                style="position:absolute;top:16px;right:16px;background:#e74c3c;color:#fff;border:0;padding:8px 16px;border-radius:6px;font-size:1rem;cursor:pointer">✕ Fermer</button>
        <div style="position:absolute;bottom:16px;color:#ccc;font-family:monospace;font-size:0.8rem">🔴 Live — ${name} — 192.168.1.178:81</div>
      </div>`;
    document.body.appendChild(modal);
  } else {
    modal.remove();
  }
}
</script>
</body>
</html>
